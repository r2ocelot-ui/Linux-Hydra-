# Calamares settings.conf — Hydra OS
---
modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary

  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksopenswaphookcfg
      - luksbootkeyfile
      - initcpiocfg
      - initcpio
      - users
      - networkcfg
      - hwclock
      - services-systemd
      - packages
      - grubcfg
      - bootloader
      - umount

  - show:
      - finished

branding: hydra

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
sidebar-style: none
