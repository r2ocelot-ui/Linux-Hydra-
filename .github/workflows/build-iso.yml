name: Build Hydra OS ISO

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ISO (Debian Bookworm + KDE)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Liberar espacio: los runners ubuntu-24.04 tienen ~67 GB total,
      # ~30 GB libres por defecto. El build necesita ~15 GB.
      - name: Liberar espacio en disco
        run: |
          echo "ANTES:" && df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" \
            /usr/share/swift \
            /usr/local/julia*
          sudo apt-get clean
          sudo docker image prune -af 2>/dev/null || true
          echo "DESPUÉS:" && df -h /

      - name: Construir ISO dentro de contenedor Debian Bookworm
        run: |
          chmod +x .github/scripts/build-in-container.sh
          docker run --rm --privileged \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            debian:bookworm \
            bash /workspace/.github/scripts/build-in-container.sh

      - name: Mostrar info de la ISO
        run: |
          echo "──────────────────────────────"
          ls -lh build/hydra-os-amd64.iso
          echo ""
          echo "SHA256: $(cat build/hydra-os-amd64.iso.sha256)"
          echo "──────────────────────────────"

      - name: Subir ISO como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: hydra-os-amd64-iso
          path: |
            build/hydra-os-amd64.iso
            build/hydra-os-amd64.iso.sha256
            build/hydra-os-amd64.iso.md5
          retention-days: 14
          compression-level: 0

      - name: Mostrar log en caso de fallo
        if: failure()
        run: |
          echo "═══ ÚLTIMAS 200 LÍNEAS DEL LOG ═══"
          tail -200 build/build.log 2>/dev/null || echo "Sin log disponible"

      # Solo se ejecuta al crear un tag vX.Y.Z
      - name: Publicar Release en GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Hydra OS ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          body: |
            ## Hydra OS ${{ github.ref_name }}

            Distribución Linux | Debian 12 Bookworm | KDE Plasma 5

            ### Descargar
            | Archivo | Descripción |
            |---|---|
            | `hydra-os-amd64.iso` | ISO instalable (UEFI + BIOS) |
            | `hydra-os-amd64.iso.sha256` | Verificación SHA256 |

            ### Verificar integridad
            ```bash
            sha256sum -c hydra-os-amd64.iso.sha256
            ```

            ### Instalar
            1. Quemar ISO en USB ≥8 GB con **Rufus** (Windows) o **Balena Etcher**
            2. Arrancar PC desde USB (F2/F12/Del en BIOS)
            3. Probar modo Live o doble-clic en **"Instalar Hydra OS"**
            4. Seguir el asistente Calamares
            5. Reiniciar y retirar el USB
          files: |
            build/hydra-os-amd64.iso
            build/hydra-os-amd64.iso.sha256
            build/hydra-os-amd64.iso.md5
