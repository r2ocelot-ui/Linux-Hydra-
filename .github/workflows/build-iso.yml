name: Build Hydra OS ISO

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ISO (Debian Bookworm + KDE)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Liberar espacio en disco (agresivo)
        run: |
          echo "ANTES:" && df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/lib/jvm \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get remove -y --purge \
            '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' \
            'php.*' '^mongodb-.*' '^mysql-.*' \
            azure-cli google-cloud-cli google-chrome-stable \
            firefox powershell mono-devel libgl1-mesa-dri \
            'temurin-.*-jdk' 2>/dev/null || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo docker image prune -af 2>/dev/null || true
          sudo journalctl --vacuum-size=10M || true
          echo "DESPUÉS:" && df -h /

      - name: Construir ISO en contenedor Debian Bookworm
        run: |
          chmod +x .github/scripts/build-in-container.sh
          docker run --rm --privileged \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            debian:bookworm \
            bash /workspace/.github/scripts/build-in-container.sh

      - name: Información de la ISO
        if: success()
        run: |
          echo "──────────────────────────────"
          ls -lh build/hydra-os-amd64.iso
          echo ""
          echo "SHA256: $(cat build/hydra-os-amd64.iso.sha256)"
          echo "──────────────────────────────"

      - name: Subir ISO como artefacto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hydra-os-amd64-iso
          path: |
            build/hydra-os-amd64.iso
            build/hydra-os-amd64.iso.sha256
            build/hydra-os-amd64.iso.md5
          retention-days: 14
          compression-level: 0

      - name: Subir logs de build (siempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/build.log
            build/config.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Mostrar log si falla
        if: failure()
        run: |
          echo "═══ build.log (últimas 300 líneas) ═══"
          tail -300 build/build.log 2>/dev/null || echo "(sin log)"
          echo ""
          echo "═══ config.log (completo) ═══"
          cat build/config.log 2>/dev/null || echo "(sin log)"

      - name: Publicar Release (solo en tag vX.Y.Z)
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Hydra OS ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          body: |
            ## Hydra OS ${{ github.ref_name }}

            Distribución Linux | Debian 12 Bookworm | KDE Plasma 5

            ### Descargar
            | Archivo | Descripción |
            |---|---|
            | `hydra-os-amd64.iso` | ISO instalable (UEFI + BIOS) |
            | `hydra-os-amd64.iso.sha256` | Verificación SHA256 |

            ### Verificar
            ```bash
            sha256sum -c hydra-os-amd64.iso.sha256
            ```

            ### Instalar
            1. Quemar ISO en USB ≥8 GB con Rufus o Balena Etcher
            2. Arrancar PC desde USB
            3. Doble-clic en "Instalar Hydra OS"
            4. Seguir el asistente Calamares
          files: |
            build/hydra-os-amd64.iso
            build/hydra-os-amd64.iso.sha256
            build/hydra-os-amd64.iso.md5
