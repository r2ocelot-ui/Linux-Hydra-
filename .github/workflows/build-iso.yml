name: Build Hydra OS ISO

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ISO (Debian Bookworm + KDE)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Liberar espacio en disco
        run: |
          echo "ANTES:" && df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/lib/jvm \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get remove -y --purge \
            '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' \
            'php.*' '^mongodb-.*' '^mysql-.*' \
            azure-cli google-cloud-cli google-chrome-stable \
            firefox powershell mono-devel 2>/dev/null || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo docker image prune -af 2>/dev/null || true
          echo "DESPUÉS:" && df -h /

      - name: Instalar live-build y dependencias
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-efi-amd64-bin \
            grub-pc-bin \
            syslinux-common \
            isolinux \
            mtools \
            dosfstools \
            binutils \
            debian-archive-keyring \
            ca-certificates \
            rsync \
            wget
          echo ""
          echo "live-build version:"
          dpkg -l live-build | tail -1

      - name: Preparar includes del chroot
        run: |
          sudo mkdir -p build/config/includes.chroot/etc/calamares.hydra
          sudo cp -r calamares/. build/config/includes.chroot/etc/calamares.hydra/
          sudo mkdir -p build/config/includes.chroot/etc/skel
          sudo cp -r kde-config/skel/. build/config/includes.chroot/etc/skel/
          echo "Listas de paquetes activas:"
          ls -la build/config/package-lists/

      - name: Ejecutar lb config
        working-directory: build
        run: |
          sudo lb clean --purge || true
          sudo lb config

      - name: Ejecutar lb build (30-60 min)
        working-directory: build
        run: |
          set +e
          sudo lb build 2>&1 | tee build.log
          LB_EXIT=${PIPESTATUS[0]}
          echo ""
          echo "════════════════════════════════"
          echo "lb build terminó con código: $LB_EXIT"
          echo "Espacio en disco tras el build:"
          df -h /
          echo "════════════════════════════════"

          ISO=$(find . -maxdepth 2 -name "*.iso" -type f 2>/dev/null | head -1)
          if [[ -z "$ISO" ]]; then
            echo "✗ No se generó ninguna ISO"
            echo ""
            echo "═══ ÚLTIMAS 200 LÍNEAS DEL LOG ═══"
            tail -200 build.log
            exit 1
          fi

          sudo mv "$ISO" hydra-os-amd64.iso
          sudo chown "$USER:$USER" hydra-os-amd64.iso
          ls -lh hydra-os-amd64.iso
          sha256sum hydra-os-amd64.iso > hydra-os-amd64.iso.sha256
          md5sum    hydra-os-amd64.iso > hydra-os-amd64.iso.md5
          echo ""
          echo "✓ ISO generada correctamente:"
          cat hydra-os-amd64.iso.sha256

      - name: Subir ISO como artefacto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hydra-os-amd64-iso
          path: |
            build/hydra-os-amd64.iso
            build/hydra-os-amd64.iso.sha256
            build/hydra-os-amd64.iso.md5
          retention-days: 14
          compression-level: 0

      - name: Subir log de build (siempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Publicar Release (solo en tag vX.Y.Z)
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Hydra OS ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          body: |
            ## Hydra OS ${{ github.ref_name }}

            Distribución Linux | Debian 12 Bookworm | KDE Plasma 5

            ### Descargar
            | Archivo | Descripción |
            |---|---|
            | `hydra-os-amd64.iso` | ISO instalable (UEFI + BIOS) |
            | `hydra-os-amd64.iso.sha256` | Verificación SHA256 |

            ### Verificar
            ```bash
            sha256sum -c hydra-os-amd64.iso.sha256
            ```

            ### Instalar
            1. Quemar ISO en USB ≥8 GB con Rufus o Balena Etcher
            2. Arrancar PC desde USB
            3. Doble-clic en "Instalar Hydra OS"
            4. Seguir el asistente Calamares
          files: |
            build/hydra-os-amd64.iso
            build/hydra-os-amd64.iso.sha256
            build/hydra-os-amd64.iso.md5
