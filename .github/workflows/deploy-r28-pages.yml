name: Deploy R28 a GitHub Pages

on:
  push:
    branches:
      - claude/fix-empty-text-blocks-3xL4R
    paths:
      - "versions/R28/**"
      - ".github/workflows/deploy-r28-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: versions/R28/hydra-traffic-lab-f2-v8-3-m1-r28-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build R28 with base path para GitHub Pages
        run: npx vite build --base /Linux-Hydra-/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: versions/R28/hydra-traffic-lab-f2-v8-3-m1-r28-release/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
