name: Deploy R28 a GitHub Pages

on:
  push:
    branches:
      - claude/fix-empty-text-blocks-3xL4R
    paths:
      - "versions/R28/**"
      - ".github/workflows/deploy-r28-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: versions/R28/hydra-traffic-lab-f2-v8-3-m1-r28-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build R28 con base path para GitHub Pages
        run: npx vite build --base /Linux-Hydra-/

      - name: Deploy a la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: versions/R28/hydra-traffic-lab-f2-v8-3-m1-r28-release/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: R28 (${{ github.sha }})"
